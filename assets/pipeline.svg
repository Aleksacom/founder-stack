<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="590" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#94a3b8">FOUNDER STACK — one pipeline from idea to customers</text>

  <!-- Stage 1: Design -->
  <g>
    <rect x="20" y="70" width="204" height="150" rx="14" fill="#6366f1"/>
    <text x="122" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d2fe">STAGE 1</text>
    <text x="122" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">DESIGN</text>
    <text x="122" y="154" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#e0e7ff">layers-* (9 skills)</text>
    <text x="122" y="182" text-anchor="middle" font-size="12" fill="#e0e7ff">What should we build?</text>
    <text x="122" y="200" text-anchor="middle" font-size="12" fill="#e0e7ff">Is the design sound?</text>
  </g>
  <line x1="228" y1="145" x2="252" y2="145" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Build -->
  <g>
    <rect x="258" y="70" width="204" height="150" rx="14" fill="#0ea5e9"/>
    <text x="360" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#bae6fd">STAGE 2</text>
    <text x="360" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">BUILD</text>
    <text x="360" y="154" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#e0f2fe">build-orchestration</text>
    <text x="360" y="182" text-anchor="middle" font-size="12" fill="#e0f2fe">Gated pipeline: plan →</text>
    <text x="360" y="200" text-anchor="middle" font-size="12" fill="#e0f2fe">review → test → commit</text>
  </g>
  <line x1="466" y1="145" x2="490" y2="145" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Audit -->
  <g>
    <rect x="496" y="70" width="204" height="150" rx="14" fill="#10b981"/>
    <text x="598" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#a7f3d0">STAGE 3</text>
    <text x="598" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">AUDIT</text>
    <text x="598" y="154" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#d1fae5">vibe-audit</text>
    <text x="598" y="182" text-anchor="middle" font-size="12" fill="#d1fae5">20-pass correctness sweep,</text>
    <text x="598" y="200" text-anchor="middle" font-size="12" fill="#d1fae5">verified findings only</text>
  </g>
  <line x1="704" y1="145" x2="728" y2="145" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Launch -->
  <g>
    <rect x="734" y="70" width="204" height="150" rx="14" fill="#f59e0b"/>
    <text x="836" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#fde68a">STAGE 4</text>
    <text x="836" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">LAUNCH</text>
    <text x="836" y="154" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#fef3c7">prelaunch-readiness</text>
    <text x="836" y="182" text-anchor="middle" font-size="12" fill="#fef3c7">Security + legal/privacy</text>
    <text x="836" y="200" text-anchor="middle" font-size="12" fill="#fef3c7">go-live gate</text>
  </g>
  <line x1="942" y1="145" x2="966" y2="145" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: Sell -->
  <g>
    <rect x="972" y="70" width="188" height="150" rx="14" fill="#e11d48"/>
    <text x="1066" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#fecdd3">STAGE 5</text>
    <text x="1066" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">SELL</text>
    <text x="1066" y="154" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ffe4e6">marketing</text>
    <text x="1066" y="182" text-anchor="middle" font-size="12" fill="#ffe4e6">Offers · hooks · content</text>
    <text x="1066" y="200" text-anchor="middle" font-size="12" fill="#ffe4e6">proof · funnel</text>
  </g>

  <!-- feedback loop: user pains feed marketing -->
  <path d="M 1066 220 L 1066 258 L 122 258 L 122 224" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="430" y="246" width="330" height="24" rx="6" fill="#94a3b8" opacity="0.15"/>
  <text x="594" y="263" text-anchor="middle" font-size="12.5" fill="#94a3b8">real user pains &amp; proof flow back into design &amp; marketing</text>

  <!-- 13 skills badge -->
  <text x="590" y="292" text-anchor="middle" font-size="12" fill="#94a3b8">14 Claude Code skills · one-step install · MIT</text>
</svg>
